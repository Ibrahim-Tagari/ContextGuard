<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      background: #1a1a2e;
      color: #f5f5f7;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #33335a;
      background: #12121f;
      color: #f5f5f7;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #4f5df5;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    .status {
      font-size: 11px;
      color: #8888a0;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Context Guard</h1>
  <div class="row">
    <label for="enabled" style="margin:0;">Enabled</label>
    <input type="checkbox" id="enabled" />
  </div>
  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://localhost:3000" />
  <button id="save">Save</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
